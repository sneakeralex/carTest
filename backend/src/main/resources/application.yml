# 应用配置
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: car-management-system
  
  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:13316/car_management_system?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
  
  # Redis配置
  # redis:
  #   host: localhost
  #   port: 6379
  #   database: 0
  #   timeout: 10000
  #   lettuce:
  #     pool:
  #       max-active: 8
  #       max-wait: -1
  #       max-idle: 8
  #       min-idle: 0


# JWT配置
jwt:
  secret: carServiceSecretKey
  expiration: 86400000  # 24小时
  tokenHeader: Authorization
  tokenPrefix: Bearer 

# 日志配置
logging:
  level:
    com.carservice: debug
    org.springframework: warn