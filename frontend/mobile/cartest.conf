upstream jsp8888 {
    server 127.0.0.1:8888 weight=5;
    keepalive 256;
}
upstream jsp8889 {
    server 127.0.0.1:8889 weight=5;
    keepalive 256;
}

upstream python6001 {
    server 127.0.0.1:6001 weight=4;
}

# 允许的跨域来源（开发阶段可开启 localhost，生产请改为前端正式域名）
map $http_origin $cors_origin {
    default "";
    "http://localhost:5173" $http_origin;
    "http://127.0.0.1:5173" $http_origin;
}

server {
    listen       443 ssl http2;
    listen       11443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  cartest.douwifi.cn;

    ssl_certificate "/home/ssl/cartest.douwifi.cn_nginx/cartest.douwifi.cn_bundle.crt";
    ssl_certificate_key "/home/ssl/cartest.douwifi.cn_nginx/cartest.douwifi.cn.key";

    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;

    add_header Server "" always;
    server_tokens off;
    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;  # 备用点击劫持防护（与 CSP 配合）
    #add_header Content-Security-Policy "default-src 'self' https://open.weixin.qq.com; img-src 'self' data: ;font-src 'self' data:; style-src 'self'; script-src 'self' 'unsafe-inline'; frame-ancestors 'self' https://open.weixin.qq.com; form-action 'self';" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 新增 Permissions-Policy 头
    #add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # 安全增强配置
    ssl_protocols        TLSv1.3 TLSv1.2;  # 仅启用 TLS 1.2 和 1.3
    ssl_ciphers          'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256';
    ssl_prefer_server_ciphers on;
    #ssl_ciphers  HIGH:!aNULL:!MD5;

    client_max_body_size 200M;
    charset utf-8 ;
    access_log  /var/log/nginx/host.access.log  main;
    root   /usr/share/nginx/html;
    index index.php  index.html index.htm;
    #proxy_intercept_errors on;

    error_page 404 500 502 503 504 /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # 允许 Nginx 解压上游 gzip 响应（若上游强制压缩）
    gunzip on;

    location / {
      proxy_pass http://localhost:8888;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* /(d2d|d2p|xhwanyi|jmap|jmap_admin|jmapmanage|supec_appointment)/ {
        set $fixed_destination $http_destination;
        if ( $http_destination ~* ^https(.*)$ )
        {
                set $fixed_destination http$1;
                                }
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        Destination $fixed_destination;
        proxy_hide_header Server;

        # 隐藏后端可能返回的 CORS 头，避免重复
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Content-Encoding;  # 隐藏上游的 Content-Encoding 头，避免浏览器解码错误

        # 关闭该位置的 gzip，避免解码问题

        index index.jsp;
        proxy_pass http://jsp8889;
    }

    location /cartest/ {
        try_files $uri $uri/ /cartest/index.html;
        index index.html;
        alias /home/cartest/frontend/;
    }
}
