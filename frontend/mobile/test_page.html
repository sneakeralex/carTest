<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试认证和路由</title>
</head>
<body>
    <h1>测试认证和路由</h1>
    <button id="setAuth">设置认证信息</button>
    <button id="clearAuth">清除认证信息</button>
    <button id="checkRoute">检查当前路由</button>
    <button id="goHome">跳转到首页</button>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        
        function log(message) {
            output.innerHTML += '<p>' + message + '</p>';
            console.log(message);
        }

        // 设置认证信息
        document.getElementById('setAuth').addEventListener('click', () => {
            const testUser = {
                userId: '1',
                employeeId: 'EMP20250101001',
                username: 'admin',
                name: '管理员',
                phone: '13800138000',
                email: 'admin@example.com',
                idCard: '310123199001010101',
                role: 'ADMIN',
                department: '车辆检测中心',
                position: '高级检测工程师',
                hireDate: '2025-01-01'
            };

            const testToken = 'mock-jwt-token-' + Date.now();

            localStorage.setItem('user', JSON.stringify(testUser));
            localStorage.setItem('token', testToken);
            
            log('认证信息已设置');
            log('用户: ' + JSON.stringify(testUser, null, 2));
            log('Token: ' + testToken);
        });

        // 清除认证信息
        document.getElementById('clearAuth').addEventListener('click', () => {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            log('认证信息已清除');
        });

        // 检查当前路由
        document.getElementById('checkRoute').addEventListener('click', () => {
            log('当前URL: ' + window.location.href);
            log('localStorage token: ' + localStorage.getItem('token'));
            log('localStorage user: ' + localStorage.getItem('user'));
        });

        // 跳转到首页
        document.getElementById('goHome').addEventListener('click', () => {
            window.location.href = 'http://localhost:5175/';
        });

        // 页面加载时检查状态
        window.addEventListener('load', () => {
            log('页面加载完成');
            log('当前URL: ' + window.location.href);
            log('localStorage token: ' + localStorage.getItem('token'));
            log('localStorage user: ' + localStorage.getItem('user'));
        });
    </script>
</body>
</html>
