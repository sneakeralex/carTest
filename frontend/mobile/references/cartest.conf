# 上游服务器配置
upstream jsp8888 {
    server 127.0.0.1:8888 weight=5;
    keepalive 256;
}
upstream jsp8889 {
    server 127.0.0.1:8889 weight=5;
    keepalive 256;
}
upstream python-server {
    server 127.0.0.1:8080 weight=5;
    keepalive 256;
}

# Gzip压缩
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/xml application/json application/javascript application/x-javascript text/javascript;
gzip_vary on;
gzip_disable "MSIE [1-6]\.";

# 主服务器配置（支持双域名）
server {
    listen       443 ssl http2;
    listen       11443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  cartest.douwifi.cn dqcsc.cn;

    # 证书配置
    ssl_certificate "/home/ssl/cartest.douwifi.cn_nginx/cartest.douwifi.cn_bundle.crt";
    ssl_certificate_key "/home/ssl/cartest.douwifi.cn_nginx/cartest.douwifi.cn.key";
    
    # dqcsc.cn域名的证书配置
    ssl_certificate "/home/ssl/dqcsc.cn_nginx/dqcsc.cn_bundle.crt";
    ssl_certificate_key "/home/ssl/dqcsc.cn_nginx/dqcsc.cn.key";

    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;

    add_header Server "" always;
    server_tokens off;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    #add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'self'; form-action 'self';" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data: https://at.alicdn.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'self'; form-action 'self';" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # 安全增强配置
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305-SHA256:HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;

    client_max_body_size 200M;
    charset utf-8;
    access_log  /var/log/nginx/host.access.log  main;
    error_log /var/log/nginx/error.log warn;

    # 连接优化
    keepalive_timeout 65;
    keepalive_requests 100;
    client_body_timeout 120;
    send_timeout 120;

    error_page 404 500 502 503 504 /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # 前端应用
    location /cartest/ {
        try_files $uri $uri/ /cartest/index.html;
        index index.html;
        alias /home/cartest/frontend/;
    }

    # 前端静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /home/cartest/frontend;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # 认证文件
    location = /RCjRtO7FL4.txt {
        root /home/ssl/verify;
        access_log off;
        log_not_found off;
        add_header Content-Type text/plain always;
    }

    # 其他特殊路径
    location ~* /(d2d|d2p|xhwanyi|jmap|jmap_admin|jmapmanage|supec_appointment)/ {
        set $fixed_destination $http_destination;
        if ( $http_destination ~* ^https(.*)$ ) {
            set $fixed_destination http$1;
        }
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        Destination $fixed_destination;
        proxy_hide_header Server;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Content-Encoding;
        index index.jsp;
        proxy_pass http://jsp8889;
    }

    # 短信回调
    location = /sms/callback {
        limit_except POST { deny all; }
        proxy_pass http://python-server/sms/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log /var/log/nginx/sms_callback.access.log main;
        error_log /var/log/nginx/sms_callback.error.log warn;
    }

    # API代理
    location /api/ {
        proxy_pass http://python-server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 所有其他路径代理到jsp8888
    location / {
        proxy_pass http://jsp8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}